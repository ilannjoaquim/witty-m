mautic.witty.config.api_key.openai="OpenAI (GPT) API key"
mautic.witty.config.api_key.gemini="Google (Gemini) API key"
mautic.witty.config.api_key.deepseek="DeepSeek API key"
mautic.witty.config.api_key.tooltip="Encrypted by Mautic before storage. This field always shows empty when the page opens (like any password field): paste a new key to replace the existing one, or leave it empty to keep it unchanged. Empty and never set = provider not enabled."
mautic.witty.config.api_key.required_one="Enter the API key for at least one provider (Anthropic, OpenAI, Google or DeepSeek)."
mautic.witty.config.model.anthropic="Default Anthropic model"
mautic.witty.config.model.openai="Default OpenAI model"
mautic.witty.config.model.gemini="Default Google model"
mautic.witty.config.model.tooltip="Leave empty to use the provider default. Acts as a fallback; the model is mostly picked from the chat itself. Model IDs change often, check the provider documentation."
mautic.witty.config.max_iterations="Max tool iterations per message"
mautic.witty.config.max_iterations.tooltip="Safety limit on the agent loop. 6 to 10 is usually enough."
mautic.witty.config.require_confirmation="Ask before writing"
mautic.witty.config.require_confirmation.tooltip="When enabled, the agent must show a preview and get your approval before creating or modifying anything."
mautic.witty.config.streaming="Stream responses"
mautic.witty.config.streaming.tooltip="Renders the answer as it is generated (SSE). Turn off if your hosting buffers responses, otherwise the answer arrives in one block and slower."
mautic.witty.config.daily_token_quota="Daily token quota per user"
mautic.witty.config.daily_token_quota.tooltip="0 = no limit. Counts input and output tokens, resets at midnight. A turn already started runs to completion; the next one is refused."
mautic.witty.config.plugnmeet.api_key="plugNmeet API key"
mautic.witty.config.plugnmeet.api_key.tooltip="Optional. Enables the Videoconference section (Rooms, Past rooms, Recordings). Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.plugnmeet.api_secret="plugNmeet API secret"
mautic.witty.config.plugnmeet.api_secret.tooltip="Used to sign every call to your plugNmeet server (HMAC). Never sent to the browser. Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.plugnmeet.server_url="plugNmeet server URL"
mautic.witty.config.plugnmeet.server_url.tooltip="Base URL of your plugNmeet instance, e.g. https://meet.example.com — no trailing slash needed."
mautic.witty.config.brightdata.api_key="Bright Data API key (MCP)"
mautic.witty.config.brightdata.api_key.tooltip="Optional. Gives the agent access to Bright Data's MCP server (web search, page scraping) through its own tools, discovered automatically. Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.brightdata.pro_mode="Bright Data: Pro mode"
mautic.witty.config.brightdata.pro_mode.tooltip="Unlocks Bright Data's roughly sixty advanced tools (instead of the five in the free plan: search, markdown scraping). Uses more credits per call — check your Bright Data plan."
mautic.witty.config.prospeo.api_key="Prospeo API key (MCP)"
mautic.witty.config.prospeo.api_key.tooltip="Optional. Gives the agent access to Prospeo's MCP server (B2B people/company search and enrichment: search_person, enrich_person, search_company...) through its own tools, discovered automatically. Combine with bulk_create_contacts to turn search results directly into contacts in a segment. Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.apollo.api_key="Apollo API key"
mautic.witty.config.apollo.api_key.tooltip="Optional. Gives the agent access to Apollo's enrichment API (enrich_person, bulk_enrich_people, enrich_company, bulk_enrich_companies) — person/company lookup only, no search (deliberately not integrated) and no Apollo contacts/lists/sequences/emails. Combine with bulk_create_contacts to turn enrichment results directly into Mautic contacts in a segment. Consumes Apollo credits per match found. Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.quickenrich.api_key="QuickEnrich API key"
mautic.witty.config.quickenrich.api_key.tooltip="Optional. Gives the agent access to QuickEnrich's contact search (quickenrich_search_contacts) and reveal endpoints (quickenrich_find_employee_email, quickenrich_find_employee_phone) — a free, external contact database, separate from Mautic's own search_contacts. Search is discovery only (has_email/has_phone booleans); the reveal tools return the actual value for a contact already identified (phone bills 1 credit only if found). Combine with bulk_create_contacts to turn results directly into Mautic contacts in a segment. Encrypted by Mautic before storage. Shows empty when the page opens (like any password field); leaving it empty keeps the stored value."
mautic.witty.config.datagouv.enabled="Enable data.gouv.fr (MCP)"
mautic.witty.config.datagouv.enabled.tooltip="Optional, no API key needed (public, read-only server). Gives the agent access to data.gouv.fr's official MCP server — search and consult French public open datasets (search_datasets, query_resource_data, search_dataservices...) through its own tools, discovered automatically. Unrelated to Mautic's own data; the agent can only read from data.gouv.fr, never write to it."
mautic.witty.config.display.logo="Custom logo"
mautic.witty.config.display.logo.tooltip="Replaces Mautic's default logo in the top navigation bar (PNG, JPEG, SVG or WebP, max 2 MB). Leave empty to keep the current one; upload a new file to replace it."
mautic.witty.config.display.favicon="Custom favicon"
mautic.witty.config.display.favicon.tooltip="Replaces Mautic's default browser tab icon (ICO or PNG, max 1 MB). Leave empty to keep the current one; upload a new file to replace it."
