mautic.witty.config.auth.note="Renseignez la clé d'au moins un fournisseur ci-dessous, puis activez le plugin. Chaque clé renseignée devient disponible dans le sélecteur du chat — inutile de revenir ici pour changer de fournisseur ou de modèle au quotidien. Les clés sont chiffrées par Mautic avant d'être stockées."
mautic.witty.config.api_key.anthropic="Clé API Anthropic (Claude)"
mautic.witty.config.api_key.openai="Clé API OpenAI (GPT)"
mautic.witty.config.api_key.gemini="Clé API Google (Gemini)"
mautic.witty.config.api_key.deepseek="Clé API DeepSeek"
mautic.witty.config.api_key.tooltip="Chiffrée par Mautic avant stockage. Ce champ s'affiche toujours vide à l'ouverture (comme tout mot de passe) : coller une nouvelle clé pour remplacer l'existante, ou laisser vide pour la conserver telle quelle. Vide et jamais renseignée = fournisseur non activé."
mautic.witty.config.api_key.required_one="Renseignez la clé API d'au moins un fournisseur (Anthropic, OpenAI, Google ou DeepSeek)."
mautic.witty.config.model.anthropic="Modèle Anthropic par défaut"
mautic.witty.config.model.openai="Modèle OpenAI par défaut"
mautic.witty.config.model.gemini="Modèle Google par défaut"
mautic.witty.config.model.tooltip="Laisser vide pour utiliser le modèle par défaut du fournisseur. Sert de valeur de repli ; le modèle se choisit surtout depuis le chat. Les identifiants de modèles changent souvent, vérifier la documentation du fournisseur."
mautic.witty.config.max_iterations="Nombre max d'itérations d'outils par message"
mautic.witty.config.max_iterations.tooltip="Garde-fou sur la boucle de l'agent. 6 à 10 suffisent en général."
mautic.witty.config.require_confirmation="Demander confirmation avant écriture"
mautic.witty.config.require_confirmation.tooltip="Si activé, l'agent doit présenter un aperçu et obtenir votre accord avant toute création ou modification."
mautic.witty.config.streaming="Réponse en streaming"
mautic.witty.config.streaming.tooltip="Affiche la réponse au fil de l'eau (SSE). À désactiver si votre hébergement bufferise les réponses : la réponse arriverait alors d'un bloc, en plus lent."
mautic.witty.config.daily_token_quota="Quota de tokens par utilisateur et par jour"
mautic.witty.config.daily_token_quota.tooltip="0 = pas de limite. Le compteur additionne les tokens d'entrée et de sortie et repart à minuit. Un tour déjà lancé va à son terme ; c'est le suivant qui est refusé."
mautic.witty.config.plugnmeet.api_key="Clé API plugNmeet"
mautic.witty.config.plugnmeet.api_key.tooltip="Facultatif. Active la section Visioconférence (Salles, Salles passées, Enregistrements). Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.plugnmeet.api_secret="Secret API plugNmeet"
mautic.witty.config.plugnmeet.api_secret.tooltip="Sert à signer chaque appel vers votre serveur plugNmeet (HMAC). Jamais envoyé au navigateur. Chiffré par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.plugnmeet.server_url="URL du serveur plugNmeet"
mautic.witty.config.plugnmeet.server_url.tooltip="URL de base de votre instance plugNmeet, ex. https://meet.exemple.com — inutile d'ajouter un / final."
mautic.witty.config.brightdata.api_key="Clé API Bright Data (MCP)"
mautic.witty.config.brightdata.api_key.tooltip="Facultatif. Donne à l'agent l'accès au serveur MCP Bright Data (recherche web, scraping de pages) via ses propres outils, découverts automatiquement. Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.brightdata.pro_mode="Bright Data : mode Pro"
mautic.witty.config.brightdata.pro_mode.tooltip="Déverrouille la soixantaine d'outils avancés de Bright Data (au lieu des cinq du plan gratuit : recherche, scraping en markdown). Consomme davantage de crédits par appel — voir votre abonnement Bright Data."
mautic.witty.config.display.logo="Logo personnalise"
mautic.witty.config.display.logo.tooltip="Remplace le logo par defaut de Mautic dans la barre de navigation (PNG, JPEG, SVG ou WebP, 2 Mo max). Laissez vide pour garder le logo actuel ; importez un nouveau fichier pour le remplacer."
