mautic.witty.config.streaming="Réponse en streaming"
mautic.witty.config.streaming.tooltip="Affiche la réponse au fil de l'eau (SSE). À désactiver si votre hébergement bufferise les réponses : la réponse arriverait alors d'un bloc, en plus lent."
mautic.witty.config.daily_token_quota="Quota de tokens par utilisateur et par jour"
mautic.witty.config.daily_token_quota.tooltip="0 = pas de limite. Le compteur additionne les tokens d'entrée et de sortie et repart à minuit. Un tour déjà lancé va à son terme ; c'est le suivant qui est refusé."
mautic.witty.config.plugnmeet.api_key="Clé API plugNmeet"
mautic.witty.config.plugnmeet.api_key.tooltip="Facultatif. Active la section Visioconférence (Salles, Salles passées, Enregistrements). Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.plugnmeet.api_secret="Secret API plugNmeet"
mautic.witty.config.plugnmeet.api_secret.tooltip="Sert à signer chaque appel vers votre serveur plugNmeet (HMAC). Jamais envoyé au navigateur. Chiffré par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.plugnmeet.server_url="URL du serveur plugNmeet"
mautic.witty.config.plugnmeet.server_url.tooltip="URL de base de votre instance plugNmeet, ex. https://meet.exemple.com — inutile d'ajouter un / final."
mautic.witty.config.brightdata.api_key="Clé API Bright Data (MCP)"
mautic.witty.config.brightdata.api_key.tooltip="Facultatif. Donne à l'agent l'accès au serveur MCP Bright Data (recherche web, scraping de pages) via ses propres outils, découverts automatiquement. Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.brightdata.pro_mode="Bright Data : mode Pro"
mautic.witty.config.brightdata.pro_mode.tooltip="Déverrouille la soixantaine d'outils avancés de Bright Data (au lieu des cinq du plan gratuit : recherche, scraping en markdown). Consomme davantage de crédits par appel — voir votre abonnement Bright Data."
mautic.witty.config.prospeo.api_key="Clé API Prospeo (MCP)"
mautic.witty.config.prospeo.api_key.tooltip="Facultatif. Donne à l'agent l'accès au serveur MCP Prospeo (recherche et enrichissement de profils/entreprises B2B : search_person, enrich_person, search_company...) via ses propres outils, découverts automatiquement. À combiner avec bulk_create_contacts pour transformer directement un résultat de recherche en contacts rattachés à un segment. Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.apollo.api_key="Clé API Apollo"
mautic.witty.config.apollo.api_key.tooltip="Facultatif. Donne à l'agent l'accès à l'API d'enrichissement Apollo (enrich_person, bulk_enrich_people, enrich_company, bulk_enrich_companies) — uniquement de la consultation de profils/entreprises, pas de recherche (volontairement non intégrée) ni de contacts/listes/séquences/emails Apollo. À combiner avec bulk_create_contacts pour transformer directement un résultat d'enrichissement en contacts Mautic rattachés à un segment. Consomme des crédits Apollo par correspondance trouvée. Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.quickenrich.api_key="Clé API QuickEnrich"
mautic.witty.config.quickenrich.api_key.tooltip="Facultatif. Donne à l'agent l'accès à la recherche de contacts QuickEnrich (quickenrich_search_contacts) et aux outils de révélation (quickenrich_find_employee_email, quickenrich_find_employee_phone) — une base de contacts externe et gratuite, distincte de search_contacts (celui de Mautic). La recherche est uniquement de la découverte (booléens has_email/has_phone) ; les outils de révélation renvoient la vraie valeur pour un contact déjà identifié (le téléphone facture 1 crédit uniquement s'il est trouvé). À combiner avec bulk_create_contacts pour transformer directement un résultat en contacts Mautic rattachés à un segment. Chiffrée par Mautic avant stockage. S'affiche vide à l'ouverture (comme tout mot de passe) ; la laisser vide conserve la valeur déjà enregistrée."
mautic.witty.config.datagouv.enabled="Activer data.gouv.fr (MCP)"
mautic.witty.config.datagouv.enabled.tooltip="Facultatif, aucune clé API requise (serveur public en lecture seule). Donne à l'agent l'accès au serveur MCP officiel de data.gouv.fr — recherche et consultation des jeux de données publiques françaises (search_datasets, query_resource_data, search_dataservices...) via ses propres outils, découverts automatiquement. Sans lien avec les données de Mautic : l'agent ne peut que lire depuis data.gouv.fr, jamais y écrire."
mautic.witty.config.display.logo="Logo personnalise"
mautic.witty.config.display.logo.tooltip="Remplace le logo par defaut de Mautic dans la barre de navigation (PNG, JPEG, SVG ou WebP, 2 Mo max). Laissez vide pour garder le logo actuel ; importez un nouveau fichier pour le remplacer."
